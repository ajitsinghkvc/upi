<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple UPI Link Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.4rem;
      color: #38bdf8;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #06b6d4;
      color: #012;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }
    button:hover {
      background: #0891b2;
    }
    .output {
      margin-top: 16px;
      display: none;
    }
    .link {
      word-break: break-all;
      background: rgba(255,255,255,0.08);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    img {
      margin-top: 10px;
      border-radius: 8px;
      background: #fff;
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UPI Link Generator</h1>
    <p>Enter your UPI ID and name to generate a UPI link and QR code.</p>

    <input type="text" id="pa" placeholder="Payee UPI ID (e.g. name@bank)">
    <input type="text" id="pn" placeholder="Payee Name">

    <button id="generate">Generate Link</button>

    <div class="output" id="output">
      <p>Your UPI Link:</p>
      <div class="link" id="link"></div>
      <img id="qr" alt="UPI QR Code">
    </div>
  </div>

  <script>
    function makeUpiLink(pa, pn) {
      const params = new URLSearchParams();
      params.set('pa', pa.trim());
      params.set('pn', pn.trim());
      params.set('cu', 'INR'); // currency always INR
      return 'upi://pay?' + params.toString();
    }

    function makeQrUrl(text) {
      const encoded = encodeURIComponent(text);
      return `https://chart.googleapis.com/chart?cht=qr&chs=200x200&chld=L|1&chl=${encoded}`;
    }

    document.getElementById('generate').addEventListener('click', () => {
      const pa = document.getElementById('pa').value.trim();
      const pn = document.getElementById('pn').value.trim();

      if (!pa || !pn) {
        alert('Please enter both UPI ID and Payee Name');
        return;
      }

      const link = makeUpiLink(pa, pn);
      document.getElementById('link').textContent = link;
      document.getElementById('qr').src = makeQrUrl(link);
      document.getElementById('output').style.display = 'block';
    });
  </script>
</body>
</html>
